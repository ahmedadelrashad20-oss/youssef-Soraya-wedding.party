<!DOCTYPE html>
<html lang="ar" id="html-tag" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دعوة زفاف يوسف و ثريا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,400;1,700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#f6efe0; --paper:#fbf7ec; --paper-2:#f1e9d5;
    --gold:#a9822f; --gold-soft:#8a6a24; --blue:#5f7f97;
    --ink:#2b2419; --ink-soft:#5a4f3d;
    --line:rgba(43,36,25,0.18); --glass:rgba(43,36,25,0.03);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:radial-gradient(ellipse at 50% 0%, rgba(95,127,151,0.08), transparent 60%), var(--cream);
    color:var(--ink); font-family:'Cairo',sans-serif; overflow-x:hidden; scroll-behavior:smooth;
  }
  ::selection{ background:var(--gold); color:var(--paper); }

  .arch-divider{ width:100%; height:34px; display:flex; align-items:center; justify-content:center; opacity:0.65; }
  .arch-divider svg{ width:150px; height:24px; }

  .lang-switch{
    position:fixed; top:18px; inset-inline-end:18px; z-index:1000;
    background:transparent; color:var(--gold-soft); border:1px solid var(--line);
    padding:8px 18px; border-radius:30px; cursor:pointer;
    font-family:'Cairo',sans-serif; font-weight:600; letter-spacing:1px; font-size:0.85rem;
    backdrop-filter:blur(6px); transition:.3s;
  }
  .lang-switch:hover{ background:var(--gold); color:var(--paper); border-color:var(--gold); }

  .hero{
    min-height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:90px 20px 60px;
  }
  .eyebrow{ font-size:0.8rem; letter-spacing:5px; text-transform:uppercase; color:var(--blue); margin-bottom:22px; }
  html[dir="rtl"] .eyebrow{ letter-spacing:2px; }

  .hero h1{
    font-family:'Aref Ruqaa',serif; font-weight:700; font-size:clamp(3rem,11vw,6rem);
    margin:0; color:var(--gold-soft); line-height:1.15;
  }
  html[dir="ltr"] .hero h1{ font-family:'Playfair Display',serif; font-style:italic; }
  .hero p.sub{ font-size:1.15rem; margin:16px 0 8px; letter-spacing:1px; opacity:0.85; }
  .time-note{ font-size:1rem; color:var(--gold-soft); letter-spacing:1px; margin-top:14px; }

  .timer-container{ display:flex; gap:12px; margin-top:34px; flex-wrap:wrap; justify-content:center; }
  .time-box{ background:var(--glass); backdrop-filter:blur(10px); border:1px solid var(--line); padding:16px 20px; min-width:82px; border-radius:10px; }
  .time-box span{ display:block; font-size:1.9rem; color:var(--gold-soft); font-weight:700; font-family:'Aref Ruqaa',serif; }
  .time-box small{ font-size:0.7rem; letter-spacing:1px; opacity:0.7; }

  .section{ padding:70px 20px; max-width:820px; margin:0 auto; }
  .reveal{ opacity:0; transform:translateY(24px); transition:opacity .8s ease, transform .8s ease; }
  .reveal.in{ opacity:1; transform:none; }

  .card{
    background:linear-gradient(180deg,var(--paper),var(--paper-2));
    padding:42px 34px; border-radius:18px; border:1px solid var(--line);
    box-shadow:0 16px 40px rgba(43,36,25,0.10);
  }
  h2{ font-family:'Aref Ruqaa',serif; color:var(--gold-soft); font-size:2.3rem; margin:0 0 26px; text-align:center; }
  html[dir="ltr"] h2{ font-family:'Playfair Display',serif; font-style:italic; }

  .bless-text{ font-size:1.25rem; line-height:2.1; text-align:center; }
  .bless-text em{ display:block; font-family:'Aref Ruqaa',serif; font-style:normal; color:var(--gold-soft); font-size:1.5rem; margin-bottom:18px; }

  .detail-row{ display:flex; justify-content:space-between; align-items:center; gap:14px; padding:14px 0; border-bottom:1px solid var(--line); font-size:1.05rem; }
  .detail-row:last-of-type{ border-bottom:none; }
  .detail-row strong{ color:var(--gold-soft); font-weight:600; }

  .map-frame{
    width:100%; height:360px; border-radius:14px; margin-top:22px; border:1px solid var(--line);
    filter:grayscale(0.35) contrast(1.05) brightness(1.02) sepia(0.06);
  }
  .btn-gold{
    display:block; width:100%; margin-top:22px; text-align:center; text-decoration:none;
    background:var(--gold); color:var(--paper); padding:15px 20px; border:none; border-radius:30px;
    font-weight:700; cursor:pointer; transition:.3s; font-size:1.05rem; font-family:'Cairo',sans-serif;
  }
  .btn-gold:hover{ transform:translateY(-2px); box-shadow:0 10px 25px rgba(169,130,47,0.35); }

  .music-toggle{
    position:fixed; bottom:22px; inset-inline-end:22px; z-index:1000; width:52px; height:52px; border-radius:50%;
    background:var(--paper); border:1px solid var(--line); color:var(--gold-soft);
    box-shadow:0 8px 20px rgba(43,36,25,0.15); display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .music-toggle svg{ width:20px; height:20px; }
  .music-toggle.playing{ animation:pulse 2.4s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{box-shadow:0 0 0 0 rgba(169,130,47,0.35);} 50%{box-shadow:0 0 0 10px rgba(169,130,47,0);} }

  footer{ padding:50px 20px 40px; text-align:center; font-size:0.85rem; opacity:0.5; letter-spacing:1px; }

  @media (prefers-reduced-motion: reduce){
    .reveal{ transition:none; opacity:1; transform:none; }
    .music-toggle.playing{ animation:none; }
  }

  .splash{
    position:fixed; inset:0; z-index:3000; background:var(--cream);
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px;
    transition:opacity .6s ease;
  }
  .splash.hide{ opacity:0; pointer-events:none; }
  .splash-names{ font-family:'Aref Ruqaa',serif; font-size:clamp(2.2rem,9vw,3.2rem); color:var(--gold-soft); margin:0 0 10px; }
  .splash-sub{ color:var(--ink-soft); font-size:0.95rem; letter-spacing:1px; margin-bottom:34px; }
  .splash-btn{ background:transparent; border:none; padding:0; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:12px; }
  .envelope-icon{ width:78px; height:auto; filter:drop-shadow(0 10px 22px rgba(169,130,47,0.35)); animation:breathe 2.6s ease-in-out infinite; transition:transform .35s ease; }
  .envelope-icon.opened{ animation:none; transform:scale(1.12); }
  .splash-btn-label{
    background:var(--gold); color:var(--paper); padding:13px 30px; border-radius:40px;
    font-family:'Cairo',sans-serif; font-size:0.95rem; font-weight:700; letter-spacing:1px;
    box-shadow:0 12px 30px rgba(169,130,47,0.3);
  }
  @keyframes breathe{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.06);} }
  .splash-arch{ width:min(200px,50vw); opacity:0.8; margin-bottom:18px; }
</style>
</head>
<body>

<div class="splash" id="splash">
  <svg class="splash-arch" viewBox="0 0 200 90" fill="none" stroke="#2b2419" stroke-width="1.2">
    <path d="M20 88 V40 C20 15 40 5 60 5 M60 5 V88 M100 88 V5 M100 5 C120 5 140 15 140 40 V88" />
  </svg>
  <p class="splash-names" id="splash-names">يوسف &amp; ثريا</p>
  <p class="splash-sub" id="splash-sub">اضغطوا للدخول للدعوة</p>
  <button class="splash-btn" id="splash-btn" onclick="enterSite()">
    <img id="envelope-icon" class="envelope-icon" src="assets/envelope-closed.png" alt="">
    <span class="splash-btn-label" id="splash-btn-text">افتحوا الدعوة</span>
  </button>
</div>

<button class="lang-switch" onclick="toggleLang()">English</button>

<section class="hero">
  <div class="eyebrow" id="eyebrow">احفظوا الموعد</div>
  <h1 id="names">يوسف &amp; ثريا</h1>
  <p class="sub" id="sub-hero">يسعدنا دعوتكم لمشاركتنا فرحة العمر</p>
  <p class="time-note" id="time-note"></p>

  <div class="timer-container">
    <div class="time-box"><span id="days">0</span><small id="lbl-days">أيام</small></div>
    <div class="time-box"><span id="hours">0</span><small id="lbl-hours">ساعات</small></div>
    <div class="time-box"><span id="mins">0</span><small id="lbl-min">دقائق</small></div>
  </div>
</section>

<div class="arch-divider">
  <svg viewBox="0 0 150 30" fill="none">
    <path d="M0 26 Q75 -6 150 26" stroke="var(--gold)" stroke-width="1"/>
    <g stroke="var(--blue)" stroke-width="1.3" fill="none">
      <path d="M75 26 C70 16 66 10 75 2 C84 10 80 16 75 26 Z"/>
      <path d="M75 26 C68 20 60 20 55 26"/>
      <path d="M75 26 C82 20 90 20 95 26"/>
    </g>
  </svg>
</div>

<section class="section reveal">
  <div class="card">
    <h2 id="bless-title">بارك الله لهما</h2>
    <p class="bless-text" id="bless-text"></p>
  </div>
</section>

<section class="section reveal">
  <h2 id="loc-title">أين ومتى؟</h2>
  <div class="card">
    <div class="detail-row"><span id="lbl-date">التاريخ</span><strong id="date-val"></strong></div>
    <div class="detail-row"><span id="lbl-time">الوقت</span><strong id="time-val"></strong></div>
    <div class="detail-row"><span id="lbl-venue">المكان</span><strong id="venue-val">دار الحرس الجمهوري</strong></div>

    <iframe class="map-frame" src="https://www.google.com/maps?q=%D8%AF%D8%A7%D8%B1+%D8%A7%D9%84%D8%AD%D8%B1%D8%B3+%D8%A7%D9%84%D8%AC%D9%85%D9%87%D9%88%D8%B1%D9%8A&output=embed" allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>

    <a class="btn-gold" id="map-btn" href="https://share.google/TBfMvDwRHs7HbPFVC" target="_blank" rel="noopener">افتح في خرائط جوجل</a>
  </div>
</section>

<audio id="bgMusic" loop preload="auto">
  <source src="assets/youssefshawki.mp3" type="audio/mpeg">
</audio>

<button class="music-toggle" id="musicBtn" onclick="handleMusic(true)" aria-label="Toggle music">
  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
</button>

<footer id="footer-text">© ٢٠٢٦ يوسف &amp; ثريا</footer>

<script>
  /* ---------- Event settings (عدّل الوقت من هنا) ---------- */
  const EVENT = { year:2026, month:10, day:30, startHour:19, endHour:21 };

  /* ---------- Music ---------- */
  const audio = document.getElementById('bgMusic');
  const musicBtn = document.getElementById('musicBtn');

  function handleMusic(userInitiated){
    if(audio.paused){
      audio.play().then(()=> musicBtn.classList.add('playing')).catch(()=>{});
    } else if(userInitiated){
      audio.pause();
      musicBtn.classList.remove('playing');
    }
  }
  function enterSite(){
    const icon = document.getElementById('envelope-icon');
    icon.classList.add('opened');
    icon.src = 'assets/envelope-open.png';
    document.getElementById('splash-btn').disabled = true;
    audio.play().then(()=> musicBtn.classList.add('playing')).catch(()=>{});
    setTimeout(()=>{
      const splash = document.getElementById('splash');
      splash.classList.add('hide');
      setTimeout(()=> splash.style.display='none', 650);
    }, 550);
  }

  /* ---------- Language ---------- */
  let currentLang = 'ar';
  const content = {
    ar: {
      eyebrow:"احفظوا الموعد", names:"يوسف &amp; ثريا",
      sub:"يسعدنا دعوتكم لمشاركتنا فرحة العمر",
      timeNote:"الجمعة، ٣٠ أكتوبر ٢٠٢٦ · من ٧:٠٠ إلى ٩:٠٠ مساءً",
      days:"أيام", hours:"ساعات", mins:"دقائق",
      blessT:"بارك الله لهما",
      blessQ:'"بارك الله لكما وبارك عليكما وجمع بينكما في خير"',
      blessP:"يسعدنا دعوتكم لمشاركتنا هذه الليلة التي تكتمل فرحتها بوجودكم والعاقبة عندكم في المسرات.",
      locT:"أين ومتى؟", lblDate:"التاريخ", date:"الجمعة ٣٠ أكتوبر ٢٠٢٦",
      lblTime:"الوقت", timeVal:"٧:٠٠ - ٩:٠٠ مساءً",
      lblVenue:"المكان", venue:"دار الحرس الجمهوري",
      map:"افتح في خرائط جوجل", switch:"English",
      splashSub:"اضغطوا للدخول للدعوة", splashBtn:"افتحوا الدعوة",
      footer:"© ٢٠٢٦ يوسف &amp; ثريا"
    },
    en: {
      eyebrow:"Save the Date", names:"Youssef &amp; Soraya",
      sub:"Together, celebrating the beginning of forever",
      timeNote:"Friday, October 30, 2026 · 7:00 – 9:00 PM",
      days:"Days", hours:"Hrs", mins:"Mins",
      blessT:"Wedding Blessing",
      blessQ:'"May God bless you both and unite you in goodness"',
      blessP:"We would be honored to have you celebrate this special evening with us.",
      locT:"Location & Time", lblDate:"Date", date:"Friday, October 30, 2026",
      lblTime:"Time", timeVal:"7:00 – 9:00 PM",
      lblVenue:"Venue", venue:"Dar El Haras El Gomhory (Republican Guard Hall)",
      map:"Open in Google Maps", switch:"العربية",
      splashSub:"Tap to open the invitation", splashBtn:"Open Invitation",
      footer:"© 2026 Youssef &amp; Soraya"
    }
  };

  function render(){
    const c = content[currentLang];
    const root = document.getElementById('html-tag');
    root.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
    root.lang = currentLang;
    const set = (id, v, html) => document.getElementById(id)[html ? 'innerHTML' : 'innerText'] = v;
    set('eyebrow', c.eyebrow);
    set('names', c.names, true);
    set('sub-hero', c.sub);
    set('time-note', c.timeNote);
    set('lbl-days', c.days); set('lbl-hours', c.hours); set('lbl-min', c.mins);
    set('bless-title', c.blessT);
    set('bless-text', `<em>${c.blessQ}</em>${c.blessP}`, true);
    set('loc-title', c.locT);
    set('lbl-date', c.lblDate); set('date-val', c.date);
    set('lbl-time', c.lblTime); set('time-val', c.timeVal);
    set('lbl-venue', c.lblVenue); set('venue-val', c.venue);
    set('map-btn', c.map);
    set('splash-names', c.names, true);
    set('splash-sub', c.splashSub);
    set('splash-btn-text', c.splashBtn);
    set('footer-text', c.footer, true);
    document.querySelector('.lang-switch').innerText = c.switch;
  }
  function toggleLang(){
    handleMusic(false);
    currentLang = currentLang === 'ar' ? 'en' : 'ar';
    render();
  }
  render();

  /* ---------- Countdown ---------- */
  const weddingDate = new Date(EVENT.year, EVENT.month - 1, EVENT.day, EVENT.startHour, 0, 0).getTime();
  function tick(){
    const diff = Math.max(0, weddingDate - Date.now());
    document.getElementById('days').innerText = Math.floor(diff / 86400000);
    document.getElementById('hours').innerText = Math.floor((diff % 86400000) / 3600000);
    document.getElementById('mins').innerText = Math.floor((diff % 3600000) / 60000);
  }
  tick();
  setInterval(tick, 1000);

  /* ---------- Reveal on scroll ---------- */
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('in'); });
  }, { threshold:0.15 });
  document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
</script>
</body>
</html>
